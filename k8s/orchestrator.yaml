apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: distbuild:latest
          command: ["orchestrator"]
          env:
            - name: ORCHESTRATOR_ADDR
              value: ":8080"
            - name: WORKER_SERVICE
              value: "worker-svc"
            - name: WORKER_PORT
              value: "8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-svc
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
