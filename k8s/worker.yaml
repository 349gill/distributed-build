apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: distbuild:latest
          command: ["worker"]
          env:
            - name: WORKER_ADDR
              value: ":8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: worker-svc
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
